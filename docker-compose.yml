version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    networks:
      - kafka-net

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-1

    depends_on:
      - zookeeper

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092,EXTERNAL://${KAFKA_HOST_IP}:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

    ports:
      - "9092:9092"

    networks:
      - kafka-net


  kafka-broker-2:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-2

    depends_on:
      - zookeeper

    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:29092,EXTERNAL://${KAFKA_HOST_IP}:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

    ports:
      - "9093:9092"

    networks:
      - kafka-net


  kafka-broker-3:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-3

    depends_on:
      - zookeeper

    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:29092,EXTERNAL://${KAFKA_HOST_IP}:9094

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

    ports:
      - "9094:9092"

    networks:
      - kafka-net


  ui:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-ui

    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3

    ports:
      - "8080:8080"

    networks:
      - kafka-net

    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >-
        kafka-broker-1:29092,
        kafka-broker-2:29092,
        kafka-broker-3:29092


  topic-init:
    image: confluentinc/cp-kafka:7.0.1
    container_name: topic-init

    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3

    command:
      - bash
      - -c
      - |
        echo "Waiting for Kafka..."
        cub kafka-ready -b kafka-broker-1:29092 3 60
  
        echo "Creating topics..."
  
        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic blocked_users \
          --partitions 3 \
          --replication-factor 2
  
        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic filtered_messages \
          --partitions 3 \
          --replication-factor 2
  
        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic messages \
          --partitions 3 \
          --replication-factor 2
  
        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic forbidden_words_action \
          --partitions 3 \
          --replication-factor 2
  
        echo "Topics:"
        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --list

  messenger:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: messenger

    depends_on:
      topic-init:
        condition: service_completed_successfully

    networks:
      - kafka-net

    environment:
      KAFKA_BOOTSTRAP_SERVERS: >-
        kafka-broker-1:29092,
        kafka-broker-2:29092,
        kafka-broker-3:29092

    command: python faust_app.py


networks:
  kafka-net:
    driver: bridge